<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>Maintenance en cours</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 1rem; }
    .card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 100%; border: 1px solid #e2e8f0; }
    h1 { color: #d97706; font-size: 1.5rem; margin-bottom: 1rem; }
    p { line-height: 1.6; color: #475569; font-size: 1rem; }
    .loader { margin: 1.5rem auto; border: 4px solid #f3f3f3; border-top: 4px solid #d97706; border-radius: 50%; width: 42px; height: 42px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>Maintenance du serveur</h1>
    <p>{{MESSAGE}}</p>
  </div>
</body>
</html>
